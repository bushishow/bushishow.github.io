name: Sync Google Reviews
on:
  schedule:
    - cron: '17 6 * * *'      # una volta al giorno (06:17 UTC) = ~30 chiamate/mese, gratis
  workflow_dispatch: {}        # esecuzione manuale a comando
permissions:
  contents: read
concurrency:
  group: google-reviews
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync reviews from Google Places
        env:
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/sync-google-reviews.py
